[project]
name = "quizthat-backend"
version = "0.1.0"
description = "Lobby relay, corpus admin and stats for QuizThat!"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "quizthat_server.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quizthat_server", "lobbies", "corpus", "stats"]
