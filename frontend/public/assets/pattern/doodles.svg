<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <!--
    QuizThat doodle field.

    A seamless 440x440 tile of line-art glyphs, one or two per question topic
    (mathematics, physics, technology, sports, history, geography, culture,
    internet, gaming). Strokes are pure white so the tile can be laid over any
    ground colour and dialled back with opacity alone - see .qt-doodles in
    theme/tokens.css. Nothing crosses the tile border, so it repeats cleanly.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- mathematics: integral -->
    <g transform="translate(34 30)">
      <path d="M6 44c0-4 3-6 6-6 8 0 6 14 6 22s-2 14 6 14c3 0 6-2 6-6"/>
      <path d="M0 12h30"/>
    </g>

    <!-- physics: atom -->
    <g transform="translate(150 26)">
      <circle cx="22" cy="22" r="4.5"/>
      <ellipse cx="22" cy="22" rx="21" ry="8.5"/>
      <ellipse cx="22" cy="22" rx="21" ry="8.5" transform="rotate(60 22 22)"/>
      <ellipse cx="22" cy="22" rx="21" ry="8.5" transform="rotate(120 22 22)"/>
    </g>

    <!-- gaming: gamepad -->
    <g transform="translate(268 34)">
      <path d="M12 6h26c7 0 12 6 13 13l3 15c1 7-4 12-10 12-4 0-7-2-9-6l-3-6H23l-3 6c-2 4-5 6-9 6-6 0-11-5-10-12l3-15C5 12 5 6 12 6z"/>
      <path d="M14 22h10M19 17v10"/>
      <circle cx="36" cy="20" r="2.2"/>
      <circle cx="42" cy="26" r="2.2"/>
    </g>

    <!-- geography: globe -->
    <g transform="translate(370 28)">
      <circle cx="22" cy="22" r="20"/>
      <path d="M2 22h40"/>
      <ellipse cx="22" cy="22" rx="9" ry="20"/>
    </g>

    <!-- culture: musical note -->
    <g transform="translate(46 132)">
      <path d="M10 40V8l24-6v32"/>
      <ellipse cx="5" cy="42" rx="6" ry="5"/>
      <ellipse cx="29" cy="36" rx="6" ry="5"/>
    </g>

    <!-- mathematics: pi -->
    <g transform="translate(128 140)">
      <path d="M2 8h32"/>
      <path d="M11 8v28"/>
      <path d="M25 8v24c0 3 2 5 5 4"/>
    </g>

    <!-- sports: football -->
    <g transform="translate(206 132)">
      <circle cx="22" cy="22" r="20"/>
      <path d="M22 10l10 7-4 12H18l-4-12z"/>
      <path d="M22 2v8M39 17l-7 0M5 17l7 0M13 41l5-12M31 41l-5-12"/>
    </g>

    <!-- history: crown -->
    <g transform="translate(296 140)">
      <path d="M2 32L6 8l12 12L28 4l10 16 12-12-4 24z"/>
      <path d="M2 32h48"/>
    </g>

    <!-- internet: at sign -->
    <g transform="translate(378 138)">
      <circle cx="21" cy="21" r="8"/>
      <path d="M29 21v4c0 4 3 6 6 6 4 0 7-4 7-10A21 21 0 1 0 30 39"/>
    </g>

    <!-- technology: gear -->
    <g transform="translate(30 246)">
      <circle cx="24" cy="24" r="8"/>
      <path d="M24 2v8M24 38v8M2 24h8M38 24h8M8 8l6 6M34 34l6 6M40 8l-6 6M14 34l-6 6"/>
    </g>

    <!-- physics: light bulb -->
    <g transform="translate(126 244)">
      <path d="M18 34a14 14 0 1 1 12 0v6H18z"/>
      <path d="M19 44h10M21 48h6"/>
    </g>

    <!-- geography: mountains -->
    <g transform="translate(196 254)">
      <path d="M2 34L16 10l10 16 6-8 14 16z"/>
      <path d="M12 18l4 4"/>
    </g>

    <!-- culture: theatre mask -->
    <g transform="translate(288 248)">
      <path d="M4 6h36v16c0 12-8 22-18 22S4 34 4 22z"/>
      <path d="M13 18c2-2 5-2 7 0M24 18c2-2 5-2 7 0"/>
      <path d="M16 30c4 4 8 4 12 0"/>
    </g>

    <!-- internet: wifi -->
    <g transform="translate(372 256)">
      <path d="M2 12a28 28 0 0 1 40 0"/>
      <path d="M9 21a18 18 0 0 1 26 0"/>
      <path d="M16 30a8 8 0 0 1 12 0"/>
      <circle cx="22" cy="38" r="2"/>
    </g>

    <!-- history: scroll -->
    <g transform="translate(48 352)">
      <path d="M6 6h32v32H6z"/>
      <path d="M13 15h18M13 22h18M13 29h11"/>
    </g>

    <!-- mathematics: x squared -->
    <g transform="translate(140 358)">
      <path d="M2 8l20 22M22 8L2 30"/>
      <path d="M28 12c0-4 8-4 8 0s-8 6-8 10h8"/>
    </g>

    <!-- sports: trophy -->
    <g transform="translate(226 352)">
      <path d="M12 4h20v14a10 10 0 0 1-20 0z"/>
      <path d="M12 8H5c0 8 3 11 7 12M32 8h7c0 8-3 11-7 12"/>
      <path d="M22 28v8M14 40h16"/>
    </g>

    <!-- technology: circuit chip -->
    <g transform="translate(312 356)">
      <path d="M10 10h24v24H10z"/>
      <path d="M18 4v6M26 4v6M18 34v6M26 34v6M4 18h6M4 26h6M34 18h6M34 26h6"/>
    </g>

    <!-- gaming: pixel heart -->
    <g transform="translate(386 358)">
      <path d="M20 36L6 22a8 8 0 0 1 14-8 8 8 0 0 1 14 8z"/>
    </g>

  </g>
</svg>
