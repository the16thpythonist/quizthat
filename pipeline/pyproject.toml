[project]
name = "quizthat-pipeline"
version = "0.1.0"
description = "Question generation pipeline for QuizThat!"
requires-python = ">=3.12"
dependencies = [
    "rich-click>=1.8",
    "rich>=13.0",
    "claude-agent-sdk>=0.1",
    "elevenlabs>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quizthat = "quizthat.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["quizthat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
